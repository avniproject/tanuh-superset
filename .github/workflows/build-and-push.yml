# Build the Tanuh Superset image and push it to ECR.
#
# Mirrors avni-infra's build-tanuh-metabase.yml. Fires on a pushed `v*` tag (the
# release path) or manual dispatch. Pushes to ECR `avniproject/tanuh-superset` via the
# OIDC role provisioned in avni-infra#94 (reportingSystem/tanuh-superset/aws_ci_setup.sh).

name: build-and-push

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: avniproject/tanuh-superset
  AWS_ROLE_ARN: arn:aws:iam::118388513628:role/tanuh-superset-gha-role

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read image tag from VERSION
        id: tag
        run: echo "image_tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
